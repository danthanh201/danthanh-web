<style>
@font-face{font-family:"Parkinsans";src:url("fonts/Parkinsans-Bold.ttf") format("truetype");font-weight:400 800;font-display:swap}
@font-face{font-family:"Youth";src:url("fonts/Youth-Regular.ttf") format("truetype");font-weight:400 600;font-display:swap}
:root{
  --porcelain:#f4f0e8;--porcelain-2:#ece5d8;--ink:#201c17;--ink-2:#574e44;
  --gold:#b0894b;--gold-deep:#8a6734;--wine:#6e2a39;--blush:#e7d6cd;--cream:#f4f0e8;
  --line:rgba(32,28,23,.14);--line-gold:rgba(176,137,75,.4);--max:1120px;
  --disp:"Parkinsans","Inter",system-ui,sans-serif;--body:"Youth","Inter",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--porcelain);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.container{width:100%;max-width:var(--max);margin:0 auto;padding:0 32px}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--disp);font-weight:600;line-height:1.05;letter-spacing:.005em}
::selection{background:var(--gold);color:var(--ink)}
.eyebrow{font-family:var(--body);text-transform:uppercase;letter-spacing:.24em;font-size:.72rem;font-weight:600;color:var(--gold);display:inline-flex;align-items:center;gap:12px;margin-bottom:18px}
.eyebrow::before{content:"";width:26px;height:1px;background:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 30px;font-family:var(--body);font-weight:600;font-size:.88rem;transition:.25s;cursor:pointer;border:1.5px solid var(--gold);border-radius:2px}
.btn-gold{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn-gold:hover{background:var(--gold-deep);color:var(--cream);transform:translateY(-2px)}
.btn-line{background:transparent;color:var(--ink)}
.btn-line:hover{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.btn-line.on-dark{color:var(--cream);border-color:rgba(244,240,232,.5)}
.btn-line.on-dark:hover{background:var(--gold);border-color:var(--gold);color:var(--ink)}

/* header */
.site-header{position:sticky;top:0;z-index:60;background:rgba(244,240,232,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:70px}
.logo{font-family:var(--disp);font-size:1.5rem;font-weight:700}
.logo b{color:var(--gold)}
.back{font-size:.82rem;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px}
.back:hover{color:var(--gold)}

/* hero */
.d-hero{background:var(--ink);color:var(--cream);padding:70px 0 64px;position:relative;overflow:hidden}
.d-hero::before{content:"";position:absolute;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(176,137,75,.2),transparent 65%);top:-200px;right:-160px}
.d-hero .inner{position:relative;z-index:2;max-width:760px}
.d-hero .eyebrow{color:var(--gold)}
.d-hero h1{font-size:clamp(2.2rem,5vw,3.6rem);margin-bottom:20px}
.d-hero .intro{font-size:1.18rem;color:rgba(244,240,232,.82);line-height:1.6;max-width:62ch}
.d-hero .actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}

/* price */
.pricebar{background:var(--porcelain-2);border-bottom:1px solid var(--line)}
.pricebar .inner{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:24px 0}
.pricebar .now{font-family:var(--disp);font-size:2.2rem;font-weight:700;color:var(--wine)}
.pricebar .old{font-size:1.1rem;color:var(--ink-2);text-decoration:line-through}
.pricebar .save{background:var(--wine);color:var(--cream);font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:2px}
.pricebar .btn{margin-left:auto}

/* sections */
.sec{padding:70px 0}
.sec h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:12px}
.sec .lead{color:var(--ink-2);max-width:60ch;margin-bottom:40px}
.sub-h{font-size:clamp(1.5rem,3.2vw,2.3rem);margin-bottom:26px}
.feat-list{display:grid;grid-template-columns:1fr 1fr;gap:0 48px;list-style:none}
.feat-list li{display:flex;gap:14px;align-items:flex-start;padding:17px 0;border-bottom:1px solid var(--line);font-size:1.08rem;color:var(--ink)}
.feat-list .tick{color:var(--gold);font-weight:700;flex:none}
.programs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pcard{border:1px solid var(--line);border-radius:3px;padding:30px 28px;background:var(--porcelain);transition:.25s}
.pcard:hover{border-color:var(--line-gold);box-shadow:0 18px 40px -26px rgba(32,28,23,.26)}
.pcard h3{font-size:1.4rem;margin-bottom:12px}
.pcard p{color:var(--ink-2);font-size:.98rem}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.flow .node{border:1.5px solid var(--gold);color:var(--ink);padding:11px 20px;border-radius:999px;font-weight:600;font-size:.92rem;background:var(--porcelain)}
.flow .sep{color:var(--gold);font-weight:700;font-size:1.15rem}
.note{margin-top:26px;font-style:italic;color:var(--ink-2);font-size:1.04rem}
.benefits{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.ben{border:1px solid var(--line);border-radius:3px;padding:28px 26px;background:var(--porcelain);transition:.25s}
.ben:hover{border-color:var(--line-gold);box-shadow:0 18px 40px -26px rgba(32,28,23,.26)}
.ben .num{font-family:var(--body);font-weight:600;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.ben h3{font-size:1.3rem;margin-bottom:8px}
.ben p{color:var(--ink-2);font-size:.95rem}

/* steps */
.steps{background:var(--porcelain-2)}
.steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px}
.step{text-align:center;padding:10px}
.step .c{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:1.3rem;margin:0 auto 18px}
.step h3{font-size:1.25rem;margin-bottom:8px}
.step p{color:var(--ink-2);font-size:.92rem;max-width:34ch;margin:0 auto}

/* contact */
.contact{background:var(--wine);color:var(--cream);text-align:center}
.contact .inner{max-width:640px;margin:0 auto}
.contact .eyebrow{color:var(--blush);justify-content:center}
.contact .eyebrow::before{background:var(--blush)}
.contact h2{color:var(--cream);font-size:clamp(2rem,4.5vw,3rem)}
.contact p{color:rgba(244,240,232,.85);margin:16px 0 32px;font-size:1.08rem}
.contact-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.contact .btn-gold{background:var(--gold);border-color:var(--gold)}
.contact .btn-gold:hover{background:var(--cream);border-color:var(--cream);color:var(--ink)}
.contact .btn-line{color:var(--cream);border-color:rgba(244,240,232,.55)}
.contact .btn-line:hover{background:var(--cream);color:var(--wine);border-color:var(--cream)}

/* footer */
.ft{background:var(--ink);color:rgba(244,240,232,.6);padding:34px 0;text-align:center;font-size:.85rem}
.ft a{color:var(--gold)}

@media(max-width:760px){
  .benefits,.steps-grid,.feat-list,.programs-grid{grid-template-columns:1fr}
  .pricebar .btn{margin-left:0;width:100%;justify-content:center}
}
</style>

function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function getSlug(){return new URLSearchParams(location.search).get("item")||"lien-he";}
const d=DATA[getSlug()]||DATA["lien-he"];
document.title="Đan Thanh — "+d.title;

let html="";
html+=`<section class="d-hero"><div class="container inner">
  <div class="eyebrow">${esc(d.kind)}</div>
  <h1>${esc(d.title)}</h1>
  <p class="intro">${esc(d.intro)}</p>
  <div class="actions"><a href="#contact" class="btn btn-gold">${esc(d.cta.text)} →</a>
  <a href="index.html" class="btn btn-line on-dark">Về trang chủ</a></div>
</div></section>`;

if(d.price){html+=`<div class="pricebar"><div class="container inner">
  <span class="now">${esc(d.price.now)}</span>${d.price.old?`<span class="old">${esc(d.price.old)}</span>`:""}
  ${d.price.save?`<span class="save">${esc(d.price.save)}</span>`:""}
  <a href="#contact" class="btn btn-gold">${esc(d.cta.text)} →</a></div></div>`;}

if(d.list){html+=`<section class="sec"><div class="container">
  <h2 class="sub-h">${esc(d.list.heading)}</h2>
  <ul class="feat-list">`+d.list.items.map(it=>`<li><span class="tick">✓</span><span>${esc(it)}</span></li>`).join("")+`</ul></div></section>`;}

if(d.programs){html+=`<section class="sec"><div class="container">
  <h2 class="sub-h">Chương trình đào tạo</h2>
  <div class="programs-grid">`+d.programs.map(p=>`<div class="pcard"><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p></div>`).join("")+`</div></div></section>`;}

if(d.flow){html+=`<section class="sec steps"><div class="container">
  <h2 class="sub-h">${esc(d.flow.heading)}</h2>
  <div class="flow">`+d.flow.steps.map((s,i)=>`${i?'<span class="sep">→</span>':''}<span class="node">${esc(s)}</span>`).join("")+`</div>`+(d.note?`<p class="note">${esc(d.note)}</p>`:"")+`</div></section>`;}

if(d.benefits){html+=`<section class="sec"><div class="container">
  <div class="eyebrow">Bạn nhận được gì</div><h2>Điểm nổi bật</h2>
  <div class="benefits">`+d.benefits.map((b,i)=>`<div class="ben"><div class="num">0${i+1}</div><h3>${esc(b.h)}</h3><p>${esc(b.p)}</p></div>`).join("")+`</div></div></section>`;}

if(d.steps){html+=`<section class="sec steps"><div class="container">
  <div class="eyebrow">Cách bắt đầu</div><h2>Chỉ 3 bước đơn giản</h2>
  <div class="steps-grid">`+d.steps.map((s,i)=>`<div class="step"><div class="c">${i+1}</div><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join("")+`</div></div></section>`;}

document.getElementById("app").innerHTML=html;
document.getElementById("cta-sub").textContent="Chọn \""+d.cta.text+"\" hoặc để lại tin nhắn — Thanh sẽ phản hồi sớm nhất.";
